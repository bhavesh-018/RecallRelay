<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" fill="none">
<title>From batch trace to confirmed response</title><desc>Illustrative recall workflow connecting a manufacturer, distributor, and shops. The affected batch is traced while other stock is excluded.</desc>
<rect width="1120" height="420" fill="#111114"/>
<g stroke="#202026"><path d="M0 100H1120M0 200H1120M0 300H1120M140 0V420M340 0V420M540 0V420M740 0V420M940 0V420"/></g>
<g font-family="Arial, sans-serif" font-size="10" letter-spacing="1.8" fill="#9696a0"><text x="55" y="42">01 / IDENTIFY</text><text x="365" y="42">02 / COORDINATE</text><text x="770" y="42">03 / VERIFY</text></g>
<g stroke="#536b8e" stroke-width="2"><path d="M275 165H365"/><path d="M585 165H660V110H770M660 165V245H770M660 245V355H770"/></g>
<g fill="#88a9d8"><circle cx="320" cy="165" r="4"/><circle cx="660" cy="165" r="4"/></g>
<g font-family="Arial, sans-serif"><rect x="55" y="112" width="220" height="106" rx="9" fill="#18181b" stroke="#36363e"/><rect x="71" y="130" width="28" height="28" rx="6" fill="#252a33"/><path d="M78 140l7 -4 7 4v9l-7 4 -7 -4zM78 140l7 4 7 -4M85 144v9" stroke="#a2b6d2" stroke-width="1.2"/><text x="110" y="142" fill="#ededed" font-size="14" font-weight="600">Manufacturer</text><text x="110" y="160" fill="#a1a1aa" font-size="11">Affected batch identified</text><path d="M74 188l3 3 6 -7" stroke="#8fb5a2" stroke-width="1.5"/><text x="91" y="192" fill="#b5c7bd" font-size="11">Recall notice published</text><rect x="365" y="112" width="220" height="106" rx="9" fill="#18181b" stroke="#36363e"/><rect x="381" y="130" width="28" height="28" rx="6" fill="#252a33"/><path d="M388 140l7 -4 7 4v9l-7 4 -7 -4zM388 140l7 4 7 -4M395 144v9" stroke="#a2b6d2" stroke-width="1.2"/><text x="420" y="142" fill="#ededed" font-size="14" font-weight="600">Distributor</text><text x="420" y="160" fill="#a1a1aa" font-size="11">Shipment destinations traced</text><path d="M384 188l3 3 6 -7" stroke="#8fb5a2" stroke-width="1.5"/><text x="401" y="192" fill="#b5c7bd" font-size="11">Location tasks created</text><rect x="770" y="65" width="290" height="93" rx="9" fill="#18181b" stroke="#36363e"/><rect x="786" y="83" width="28" height="28" rx="6" fill="#252a33"/><path d="M793 93l7 -4 7 4v9l-7 4 -7 -4zM793 93l7 4 7 -4M800 97v9" stroke="#a2b6d2" stroke-width="1.2"/><text x="825" y="95" fill="#ededed" font-size="14" font-weight="600">Shop / North</text><text x="825" y="113" fill="#a1a1aa" font-size="11">Notice acknowledged</text><path d="M789 141l3 3 6 -7" stroke="#8fb5a2" stroke-width="1.5"/><text x="806" y="145" fill="#b5c7bd" font-size="11">Stock set aside</text><rect x="770" y="200" width="290" height="93" rx="9" fill="#18181b" stroke="#36363e"/><rect x="786" y="218" width="28" height="28" rx="6" fill="#252a33"/><path d="M793 228l7 -4 7 4v9l-7 4 -7 -4zM793 228l7 4 7 -4M800 232v9" stroke="#a2b6d2" stroke-width="1.2"/><text x="825" y="230" fill="#ededed" font-size="14" font-weight="600">Shop / Central</text><text x="825" y="248" fill="#a1a1aa" font-size="11">Count submitted</text><path d="M789 276l3 3 6 -7" stroke="#8fb5a2" stroke-width="1.5"/><text x="806" y="280" fill="#b5c7bd" font-size="11">Response reconciled</text><rect x="770" y="320" width="290" height="70" rx="9" fill="#18181b" stroke="#36363e"/><rect x="786" y="338" width="28" height="28" rx="6" fill="#252a33"/><path d="M793 348l7 -4 7 4v9l-7 4 -7 -4zM793 348l7 4 7 -4M800 352v9" stroke="#a2b6d2" stroke-width="1.2"/><text x="825" y="350" fill="#ededed" font-size="14" font-weight="600">Shop / South</text><text x="825" y="368" fill="#a1a1aa" font-size="11">Awaiting confirmation</text><rect x="55" y="267" width="530" height="75" rx="8" fill="#141417" stroke="#2b2b32" stroke-dasharray="4 4"/><circle cx="78" cy="291" r="4" fill="#71717a"/><text x="92" y="295" fill="#c4c4cc" font-size="12">Unaffected batch</text><text x="76" y="318" fill="#9696a0" font-size="11">Kept outside the recall. Each task stays scoped to the affected stock.</text><text x="55" y="387" fill="#9696a0" font-size="10" letter-spacing=".8">ILLUSTRATION ONLY · NO LIVE RECALL DATA</text></g></svg>